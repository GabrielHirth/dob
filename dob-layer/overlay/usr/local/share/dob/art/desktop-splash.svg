<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="DOB desktop splash">
  <defs>
    <radialGradient id="field" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#A9CFEF"/>
      <stop offset="0.55" stop-color="#3A6EA5"/>
      <stop offset="1" stop-color="#21486F"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0102A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E63950" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C0102A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB2E0"/>
      <stop offset="0.5" stop-color="#3A6EA5"/>
      <stop offset="1" stop-color="#234E7A"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redGlossBold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.22" stop-color="#FF6E82"/>
      <stop offset="0.5" stop-color="#E63950"/>
      <stop offset="0.82" stop-color="#C0102A"/>
      <stop offset="1" stop-color="#7A0A1E"/>
    </linearGradient>
    <radialGradient id="redGlowBold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E63950" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E63950" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A1A2E" flood-opacity="0.4"/>
    </filter>
    <filter id="glowBlur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Blue glass field -->
  <rect width="1920" height="1080" fill="url(#field)"/>

  <!-- Bold red accent sweep (animated-capable base) -->
  <g id="accentSweep" opacity="0.9">
    <rect x="-300" y="0" width="500" height="1080" fill="url(#sweep)" filter="url(#glowBlur)" transform="rotate(18 960 540)"/>
  </g>
  <rect width="1920" height="1080" fill="url(#sweep)" opacity="0.12"/>

  <!-- Centered logo panel -->
  <g transform="translate(704,460)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="512" height="160" rx="26" ry="26" fill="url(#glassBody)" stroke="#BFE0FF" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>
    <rect x="8" y="6" width="496" height="64" rx="20" ry="20" fill="url(#topGloss)"/>
    <ellipse cx="256" cy="88" rx="170" ry="52" fill="url(#redGlowBold)"/>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="104" text-anchor="middle" letter-spacing="6">
      <text x="256" y="122" fill="#7A0A1E">DOB</text>
      <text x="256" y="118" fill="url(#redGlossBold)" stroke="#7A0A1E" stroke-width="0.8" stroke-opacity="0.5">DOB</text>
    </g>
  </g>
</svg>
