<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" width="512" height="160" role="img" aria-label="DOB">
  <defs>
    <!-- Blue glass body -->
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB2E0"/>
      <stop offset="0.5" stop-color="#3A6EA5"/>
      <stop offset="1" stop-color="#234E7A"/>
    </linearGradient>
    <!-- White top gloss -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Red gloss text fill -->
    <linearGradient id="redGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE8EC"/>
      <stop offset="0.28" stop-color="#E63950"/>
      <stop offset="0.78" stop-color="#E63950"/>
      <stop offset="1" stop-color="#C0102A"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E63950" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E63950" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A1A2E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Glass panel -->
  <g filter="url(#softShadow)">
    <rect x="6" y="10" width="500" height="140" rx="26" ry="26" fill="url(#glassBody)" stroke="#BFE0FF" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <!-- Top gloss sweep -->
  <rect x="14" y="16" width="484" height="64" rx="20" ry="20" fill="url(#topGloss)"/>

  <!-- Red glow behind wordmark -->
  <ellipse cx="256" cy="88" rx="150" ry="44" fill="url(#redGlow)"/>

  <!-- Wordmark: depth shadow then red-gloss fill -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="104" text-anchor="middle" letter-spacing="6">
    <text x="256" y="121" fill="#7A0A1E" opacity="0.85">DOB</text>
    <text x="256" y="118" fill="url(#redGloss)" stroke="#7A0A1E" stroke-width="0.6" stroke-opacity="0.4">DOB</text>
  </g>
</svg>
