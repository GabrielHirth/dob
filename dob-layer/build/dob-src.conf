# dob-src.conf — src.conf for DOB world/kernel build.
# Skips building LLVM/Clang/LLD in-tree; we rely on the host toolchain
# (passed via XCC/XCXX/XCPP/XLD) and ship LLVM as a pkg instead.
WITHOUT_CLANG=YES
WITHOUT_CLANG_BOOTSTRAP=YES
WITHOUT_CLANG_FULL=YES
WITHOUT_CLLD=YES
WITHOUT_LLD=YES
WITHOUT_LLVM=YES
WITHOUT_BINUTILS=YES
